[project]
name = "pipe-bci-toolkit"
version = "0.1.0"
description = "A complete toolbox for EEG processing, Riemannian geometry, and BCI pipelines."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "cookiecutter-data-science>=2.2.0",
    "filelock>=3.20.0",
    "h5py>=3.15.1",
    "matplotlib>=3.10.1",
    "mlflow>=3.1.0",
    "mne>=1.9.0",
    "moabb>=1.2.0",
    "numpy>=1.26.4",
    "optuna>=4.4.0",
    "optuna-integration[mlflow]>=4.4.0",
    "pillow>=12.0.0",
    "pip>=25.1",
    "pyriemann>=0.7",
    "pytest>=8.3.5",
    "qc-procrustes>=1.1.2",
    "scipy>=1.15.3",
    "umap-learn>=0.5.7",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pytest>=8.3.5",
]

[tool.setuptools.packages.find]
where = ["src"]
